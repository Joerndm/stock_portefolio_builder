[pytest]
# Only collect from tests/ — keeps pytest away from scripts/, docs/,
# and any leftover files during the test_reports/ migration.
testpaths = tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for suites that need external resources.
# Usage: pytest tests -m "not requires_db"
markers =
    requires_db: needs a live MySQL instance (integration/e2e)
    requires_gpu: needs the TensorFlow/GPU ML stack
    slow: long-running performance benchmarks
