# CI pipeline: lint + unit tests
#
# Replaces the old pylint.yml, which ran `pylint --fail-under=0` and therefore
# could never fail. This workflow actually enforces quality gates:
#
#   - lint:  pylint with a real threshold. Find your current score with
#            `pylint $(git ls-files '*.py')` locally, set PYLINT_THRESHOLD
#            just below it, then ratchet it upward over time.
#   - tests: runs the unit test suite in tests/unit with pytest.
#            Integration/e2e/performance tests need a live MySQL instance
#            and are excluded here; run those locally or add a service
#            container in a follow-up.
#
# Both jobs run in parallel on every push and pull request.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  PYLINT_THRESHOLD: "6.5"   # Adjust to just below your current score, then ratchet up

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_PY_3_12.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements_PY_3_12.txt

      - name: Run pylint (enforcing threshold)
        run: |
          pylint --fail-under=${{ env.PYLINT_THRESHOLD }} $(git ls-files '*.py' | grep -v '^tests/' | grep -v '^test_reports/')

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_PY_3_12.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements_PY_3_12.txt

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short